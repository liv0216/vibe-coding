<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>분수 덧셈 대작전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen game. Landscape tablet = problem card left, number pad right; portrait/phone = stacked. Bright, single-theme look by choice. */
:root {
  --sky: #d9f1ff;
  --paper: #ffffff;
  --ink: #1d2b53;
  --ink-soft: #55628a;
  --sun: #ffd23f;
  --blue: #3a86ff;
  --coral: #ff6b6b;
  --mint: #22b8a7;
  --line: #b9d9f0;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 1100px;
  margin: 0 auto;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font-family: var(--display); color: var(--ink); cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

/* ---------- 분수 표기 ---------- */
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 .08em; }
.fr .nu { padding: 0 .18em .08em; }
.fr .de { padding: .08em .18em 0; border-top: .08em solid currentColor; }
.mixed { display: inline-flex; align-items: center; gap: .05em; }

/* ---------- 시작 / 결과 화면 ---------- */
.screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
.logo { font-family: var(--display); font-size: clamp(44px, 9vw, 84px); line-height: 1.1; margin: 0; text-wrap: balance; }
.logo .plus { color: var(--coral); }
.lead { font-size: clamp(18px, 2.6vw, 24px); color: var(--ink-soft); margin: 0; max-width: 32ch; line-height: 1.6; }
.demo { font-family: var(--display); font-size: clamp(40px, 7vw, 64px); background: var(--paper); border-radius: 28px; padding: 18px 36px; box-shadow: 0 8px 0 var(--line); display: flex; align-items: center; gap: 14px; }
.demo .op { color: var(--coral); }
.rules { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.rules li { background: var(--paper); border-radius: 999px; padding: 10px 20px; font-size: 18px; }
.rules b { font-family: var(--display); font-weight: 400; color: var(--blue); }
.big-btn {
  font-size: clamp(28px, 4.5vw, 40px);
  background: var(--sun);
  border: 0;
  border-radius: 24px;
  padding: 20px 56px;
  min-height: 84px;
  box-shadow: 0 8px 0 #e0a800;
  transition: transform .08s, box-shadow .08s;
}
.big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #e0a800; }

/* ---------- 상단 바 ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.qnum { font-family: var(--display); font-size: 26px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: var(--paper); border: 3px solid var(--line); }
.dot.now { border-color: var(--blue); background: var(--sun); }
.dot.ok { background: var(--mint); border-color: var(--mint); }
.dot.miss { background: var(--coral); border-color: var(--coral); }
.score { font-family: var(--display); font-size: 26px; background: var(--paper); border-radius: 999px; padding: 8px 22px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.score b { font-weight: 400; color: var(--blue); font-size: 32px; }
.score.pop b { animation: pop .5s; }
@keyframes pop { 40% { transform: scale(1.5); color: var(--mint); } }

/* ---------- 게임 본문 ---------- */
.play { flex: 1; display: grid; gap: 16px; grid-template-columns: 1fr; align-content: start; }
@media (min-width: 860px) and (orientation: landscape) {
  .play { grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); align-content: stretch; }
}
.card { background: var(--paper); border-radius: 28px; padding: 24px; box-shadow: 0 8px 0 var(--line); display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.ask { font-size: 20px; color: var(--ink-soft); margin: 0; }
.equation { font-family: var(--display); font-size: clamp(44px, 8vw, 76px); display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 16px; }
.equation .op { color: var(--coral); }

.answer { display: flex; align-items: center; gap: 10px; }
.slot {
  font-family: var(--display);
  font-size: clamp(34px, 6vw, 52px);
  min-width: 1.9em;
  height: 1.55em;
  border-radius: 16px;
  border: 4px dashed var(--line);
  background: #f4faff;
  display: flex; align-items: center; justify-content: center;
  padding: 0 .2em;
  font-variant-numeric: tabular-nums;
}
.slot.whole { min-width: 1.5em; }
.slot.active { border-style: solid; border-color: var(--blue); background: #fff6cc; }
.slot:empty::after { content: "?"; color: #b8c7dc; }
.slot-frac { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.slot-frac .bar { width: 100%; height: 7px; border-radius: 4px; background: var(--ink); }
.slot-label { font-family: var(--body); font-size: 13px; color: var(--ink-soft); text-align: center; margin-top: 4px; }
.slot-wrap { display: flex; flex-direction: column; align-items: center; }

.feedback { border-radius: 20px; padding: 16px 20px; font-size: 20px; line-height: 1.6; display: flex; flex-direction: column; gap: 12px; }
.feedback[data-kind="good"] { background: #dbf7f2; }
.feedback[data-kind="hint"] { background: #fff3c4; }
.feedback[data-kind="info"] { background: #eef6ff; }
.feedback .title { font-family: var(--display); font-size: 28px; }
.feedback[data-kind="good"] .title { color: #0f8a7c; }
.feedback[data-kind="hint"] .title { color: #c2410c; }
.feedback .math { font-family: var(--display); font-size: 30px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }

/* 분수 막대 (힌트용) */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-row .lbl { font-family: var(--display); font-size: 22px; width: 3.2em; flex: none; text-align: right; }
.cells { flex: 1; display: grid; gap: 2px; min-width: 0; height: 30px; }
.cell { background: #ffffff; border: 2px solid #e2c766; border-radius: 4px; }
.cell.a { background: var(--blue); border-color: var(--blue); }
.cell.b { background: var(--coral); border-color: var(--coral); }

/* 숫자 패드 */
.pad { background: var(--paper); border-radius: 28px; padding: 18px; box-shadow: 0 8px 0 var(--line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; }
.key {
  font-size: clamp(30px, 5vw, 40px);
  min-height: 76px;
  border-radius: 20px;
  border: 0;
  background: #e8f3ff;
  box-shadow: 0 6px 0 #b5d3f0;
  transition: transform .06s, box-shadow .06s;
}
.key:active { transform: translateY(5px); box-shadow: 0 1px 0 #b5d3f0; }
.key.del { background: #ffe1e1; box-shadow: 0 6px 0 #f2a9a9; font-size: 24px; }
.key.del:active { box-shadow: 0 1px 0 #f2a9a9; }
.key.ok { background: var(--mint); color: #ffffff; box-shadow: 0 6px 0 #138a7d; font-size: 28px; }
.key.ok:active { box-shadow: 0 1px 0 #138a7d; }
.key.next { background: var(--sun); color: var(--ink); box-shadow: 0 6px 0 #e0a800; }
.key.next:active { box-shadow: 0 1px 0 #e0a800; }
.pad-tip { grid-column: 1 / -1; font-size: 15px; color: var(--ink-soft); margin: 0; text-align: center; }

/* 결과 */
.final-score { font-family: var(--display); font-size: clamp(64px, 14vw, 120px); line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; }
.final-score small { font-size: .4em; color: var(--ink-soft); }
.stars { font-size: clamp(40px, 8vw, 60px); letter-spacing: 6px; color: var(--sun); text-shadow: 0 3px 0 #e0a800; }
.stars .off { color: #ffffff; text-shadow: 0 3px 0 var(--line); }
.review { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; max-width: 900px; }
.review li { background: var(--paper); border-radius: 16px; padding: 10px 14px; font-family: var(--display); font-size: 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 3px solid transparent; }
.review li.ok { border-color: var(--mint); }
.review li.miss { border-color: var(--coral); }
.review .tag { font-family: var(--body); font-size: 14px; border-radius: 999px; padding: 4px 10px; color: #ffffff; flex: none; }
.review li.ok .tag { background: var(--mint); }
.review li.miss .tag { background: var(--coral); }
.review .eq { display: flex; align-items: center; gap: 4px; font-size: 22px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<div class="app" id="app"></div>

<script>
(() => {
  const TOTAL = 10;
  const app = document.getElementById('app');

  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const lcm = (a, b) => (a / gcd(a, b)) * b;
  const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

  // 분수 HTML (가분수는 대분수로 보여 줌)
  const frac = (n, d) => `<span class="fr"><span class="nu">${n}</span><span class="de">${d}</span></span>`;
  function nice(n, d) {
    const g = gcd(n, d); n /= g; d /= g;
    if (d === 1) return `${n}`;
    if (n < d) return frac(n, d);
    return `<span class="mixed">${Math.floor(n / d)}${frac(n % d, d)}</span>`;
  }

  // 초등 5학년: 분모가 다른 진분수의 덧셈 (공통분모 24 이하)
  function makeProblems() {
    const list = [], seen = new Set();
    while (list.length < TOTAL) {
      const b = rand(2, 12), d = rand(2, 12);
      if (b === d) continue;
      const L = lcm(b, d);
      if (L > 24) continue;
      const a = rand(1, b - 1), c = rand(1, d - 1);
      if (gcd(a, b) !== 1 || gcd(c, d) !== 1) continue;
      const key = [a, b, c, d].join('/');
      if (seen.has(key)) continue;
      seen.add(key);
      const x = a * (L / b), y = c * (L / d);
      list.push({ a, b, c, d, L, x, y, num: x + y, den: L, tries: 0, result: null });
    }
    return list;
  }

  let state;

  // ---------- 시작 화면 ----------
  function showStart() {
    app.innerHTML = `
      <section class="screen">
        <h1 class="logo">분수 덧셈<br><span class="plus">대작전</span></h1>
        <div class="demo" aria-hidden="true">${frac(1, 2)}<span class="op">+</span>${frac(1, 3)}<span class="op">=</span>${frac(5, 6)}</div>
        <p class="lead">분모가 다른 두 분수를 더해 봐요. 막히면 힌트가 도와줄 거예요!</p>
        <ul class="rules">
          <li>문제 <b>10개</b></li>
          <li>맞히면 <b>+10점</b></li>
          <li>틀리면 <b>힌트</b></li>
        </ul>
        <button class="big-btn" id="start">시작하기 ▶</button>
      </section>`;
    document.getElementById('start').onclick = startGame;
  }

  function startGame() {
    state = { problems: makeProblems(), i: 0, score: 0, input: { whole: '', num: '', den: '' }, field: 'num', done: false };
    renderPlay();
  }

  // ---------- 게임 화면 ----------
  function renderPlay() {
    const p = state.problems[state.i];
    const dots = state.problems.map((q, k) =>
      `<span class="dot ${q.result === true ? 'ok' : q.result === false ? 'miss' : k === state.i ? 'now' : ''}"></span>`).join('');

    app.innerHTML = `
      <header class="top">
        <div class="qnum">${state.i + 1}번 문제 <span style="color:var(--ink-soft)">/ ${TOTAL}</span></div>
        <div class="dots" aria-hidden="true">${dots}</div>
        <div class="score" id="score">점수 <b>${state.score}</b></div>
      </header>
      <main class="play">
        <section class="card">
          <p class="ask">계산해서 답을 써 보세요. 1보다 크면 자연수 칸도 써요.</p>
          <div class="equation">
            ${frac(p.a, p.b)}<span class="op">+</span>${frac(p.c, p.d)}<span class="op">=</span>
            <div class="answer">
              <div class="slot-wrap">
                <button class="slot whole" data-field="whole" aria-label="자연수 칸"></button>
                <div class="slot-label">자연수</div>
              </div>
              <div class="slot-frac">
                <button class="slot" data-field="num" aria-label="분자 칸"></button>
                <div class="bar"></div>
                <button class="slot" data-field="den" aria-label="분모 칸"></button>
              </div>
            </div>
          </div>
          <div class="feedback" id="fb" data-kind="info" aria-live="polite">
            <div>칸을 눌러 고른 뒤, 숫자 버튼으로 답을 넣어요.</div>
          </div>
        </section>
        <section class="pad" id="pad">
          ${[7, 8, 9, 4, 5, 6, 1, 2, 3].map(n => `<button class="key" data-key="${n}">${n}</button>`).join('')}
          <button class="key del" data-key="del">지우기</button>
          <button class="key" data-key="0">0</button>
          <button class="key ok" data-key="ok" id="okKey">확인</button>
          <p class="pad-tip">노란 칸에 숫자가 들어가요 · 칸을 눌러 바꿔요</p>
        </section>
      </main>`;

    app.querySelectorAll('.slot').forEach(s => s.onclick = () => { if (!state.done) { state.field = s.dataset.field; paintSlots(); } });
    app.querySelectorAll('.key').forEach(k => k.onclick = () => press(k.dataset.key));
    paintSlots();
  }

  function paintSlots() {
    app.querySelectorAll('.slot').forEach(s => {
      const f = s.dataset.field;
      s.textContent = state.input[f];
      s.classList.toggle('active', !state.done && f === state.field);
    });
  }

  function press(key) {
    if (state.done) { if (key === 'ok' || key === 'next') next(); return; }
    const f = state.field;
    if (key === 'del') {
      if (state.input[f]) state.input[f] = state.input[f].slice(0, -1);
      else if (f === 'den') state.field = 'num';
      else if (f === 'num') state.field = 'whole';
    } else if (key === 'ok') {
      check(); return;
    } else if (/^\d$/.test(key)) {
      if (state.input[f].length >= 3) return;
      if (state.input[f] === '0') state.input[f] = '';
      state.input[f] += key;
    }
    paintSlots();
  }

  function setFeedback(kind, html) {
    const fb = document.getElementById('fb');
    fb.dataset.kind = kind;
    fb.innerHTML = html;
  }

  function check() {
    const p = state.problems[state.i];
    const { whole, num, den } = state.input;
    const onlyWhole = num === '' && den === '' && whole !== '';
    if (!onlyWhole && (num === '' || den === '')) {
      setFeedback('info', `<div>분자와 분모를 모두 써 주세요.</div>`);
      state.field = num === '' ? 'num' : 'den'; paintSlots(); return;
    }
    const w = parseInt(whole || '0', 10);
    const n = parseInt(num || '0', 10);
    const d = onlyWhole ? 1 : parseInt(den, 10);
    if (d === 0) { setFeedback('info', `<div>분모에는 0을 쓸 수 없어요.</div>`); state.field = 'den'; paintSlots(); return; }

    const correct = (w * d + n) * p.den === p.num * d;
    p.tries++;

    if (correct) {
      p.result = true;
      state.score += 10;
      state.done = true;
      const g = gcd(n, d);
      const notSimple = g > 1 || (n >= d && n > 0);
      const extra = notSimple
        ? `<div>잘했어요! 가장 간단하게 나타내면 <span class="math" style="display:inline-flex">${nice(p.num, p.den)}</span> 이에요.</div>`
        : `<div>${p.tries === 1 ? '한 번에 맞혔어요!' : '힌트를 잘 활용했어요!'}</div>`;
      setFeedback('good', `<div class="title">정답! +10점 🎉</div>${extra}`);
      const sc = document.getElementById('score');
      sc.querySelector('b').textContent = state.score;
      sc.classList.remove('pop'); void sc.offsetWidth; sc.classList.add('pop');
      toNextKey();
    } else if (p.tries === 1) {
      setFeedback('hint', `
        <div class="title">힌트 1 · 분모를 같게!</div>
        <div>분모가 <b>${p.b}</b>와 <b>${p.d}</b>로 달라요. 두 수의 <b>최소공배수</b>를 찾아 분모를 같게 만들어 보세요.</div>
        <div>${p.b}의 배수: ${multiples(p.b, p.L)} · ${p.d}의 배수: ${multiples(p.d, p.L)}</div>`);
      clearInput();
    } else if (p.tries === 2) {
      setFeedback('hint', `
        <div class="title">힌트 2 · 통분하기</div>
        <div class="math">${frac(p.a, p.b)} = ${frac(p.x, p.L)} <span style="color:var(--ink-soft)">,</span> ${frac(p.c, p.d)} = ${frac(p.y, p.L)}</div>
        ${bars(p)}
        <div>분모는 그대로 <b>${p.L}</b>, 분자끼리 더해 보세요. 1보다 크면 대분수로 바꿔요.</div>`);
      clearInput();
    } else {
      p.result = false;
      state.done = true;
      setFeedback('hint', `
        <div class="title">아쉬워요! 함께 풀어 봐요</div>
        <div class="math">${frac(p.x, p.L)} + ${frac(p.y, p.L)} = ${frac(p.num, p.den)} = ${nice(p.num, p.den)}</div>
        <div>다음 문제에서 다시 도전해요. 할 수 있어요!</div>`);
      toNextKey();
    }
  }

  function multiples(n, upto) {
    const out = [];
    for (let m = n; m <= upto; m += n) out.push(m === upto ? `<b style="color:var(--coral)">${m}</b>` : m);
    return out.join(', ');
  }

  function bars(p) {
    const row = (lbl, count, cls) =>
      `<div class="bar-row"><span class="lbl">${lbl}</span><div class="cells" style="grid-template-columns:repeat(${p.L},1fr)">${
        Array.from({ length: p.L }, (_, k) => `<span class="cell ${k < count ? cls : ''}"></span>`).join('')}</div></div>`;
    return `<div class="bars" aria-hidden="true">${row(frac(p.x, p.L), p.x, 'a')}${row(frac(p.y, p.L), p.y, 'b')}</div>`;
  }

  function clearInput() {
    state.input = { whole: '', num: '', den: '' };
    state.field = 'num';
    paintSlots();
  }

  function toNextKey() {
    paintSlots();
    const ok = document.getElementById('okKey');
    ok.classList.remove('ok'); ok.classList.add('next');
    ok.textContent = state.i + 1 < TOTAL ? '다음 ▶' : '결과 ▶';
    ok.dataset.key = 'next';
  }

  function next() {
    if (state.i + 1 >= TOTAL) { showResult(); return; }
    state.i++;
    state.input = { whole: '', num: '', den: '' };
    state.field = 'num';
    state.done = false;
    renderPlay();
  }

  // ---------- 결과 화면 ----------
  function showResult() {
    const s = state.score;
    const starCount = s >= 90 ? 3 : s >= 60 ? 2 : s >= 30 ? 1 : 0;
    const msg = s === 100 ? '완벽해요! 분수 덧셈 박사님!'
      : s >= 70 ? '정말 잘했어요! 조금만 더 하면 만점이에요.'
      : s >= 40 ? '좋아요! 통분을 연습하면 더 잘할 수 있어요.'
      : '괜찮아요! 힌트를 보며 다시 도전해 봐요.';
    const stars = [0, 1, 2].map(k => `<span class="${k < starCount ? '' : 'off'}">★</span>`).join('');
    const review = state.problems.map(p => `
      <li class="${p.result ? 'ok' : 'miss'}">
        <span class="eq">${frac(p.a, p.b)}+${frac(p.c, p.d)}=${nice(p.num, p.den)}</span>
        <span class="tag">${p.result ? '맞힘' : '다시 보기'}</span>
      </li>`).join('');
    app.innerHTML = `
      <section class="screen">
        <div class="stars" aria-label="별 ${starCount}개">${stars}</div>
        <div class="final-score">${s}<small>점</small></div>
        <p class="lead">${msg}</p>
        <ul class="review">${review}</ul>
        <button class="big-btn" id="again">다시 하기 ↻</button>
      </section>`;
    document.getElementById('again').onclick = startGame;
  }

  // 키보드로도 입력 가능 (태블릿 외장 키보드 / PC)
  document.addEventListener('keydown', e => {
    if (!state || !document.getElementById('pad')) return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
    else if (e.key === 'Enter') { e.preventDefault(); press(state.done ? 'next' : 'ok'); }
    else if (e.key === 'Tab' && !state.done) {
      e.preventDefault();
      const order = ['whole', 'num', 'den'];
      state.field = order[(order.indexOf(state.field) + (e.shiftKey ? 2 : 1)) % 3];
      paintSlots();
    }
  });

  showStart();
})();
</script>

</body></html>
