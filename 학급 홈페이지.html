<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2학년 10반 학급 홈페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #2ed3a0;
    --mint-dark: #13a97b;
    --mint-soft: #e3fbf2;
    --lime: #b8f05a;
    --sky: #5cc8ff;
    --sky-soft: #e6f6ff;
    --sun: #ffd43b;
    --sun-soft: #fff8d6;
    --peach: #ff8fa3;
    --peach-soft: #ffeef1;
    --ink: #24323a;
    --ink-soft: #66757d;
    --line: #e4ece9;
    --bg: #f5fbf8;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  /* ---------- 상단 네비게이션 ---------- */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar .wrap {
    display: flex; align-items: center; justify-content: space-between;
    height: 52px; gap: 12px;
  }
  .mini-logo { font-family: 'Jua', sans-serif; font-size: 20px; color: var(--mint-dark); white-space: nowrap; }
  .nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a {
    padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500;
    color: var(--ink-soft); white-space: nowrap; transition: .2s;
  }
  .nav a:hover, .nav a.active { background: var(--mint-soft); color: var(--mint-dark); }

  /* ---------- 히어로 + 중앙 검색창 ---------- */
  .hero {
    background:
      radial-gradient(circle at 12% 30%, rgba(255,212,59,.35) 0 90px, transparent 91px),
      radial-gradient(circle at 88% 70%, rgba(92,200,255,.30) 0 120px, transparent 121px),
      linear-gradient(135deg, #dcfff0 0%, #f0ffe0 50%, #e2f5ff 100%);
    padding: 56px 0 40px;
    text-align: center;
  }
  .logo {
    font-family: 'Jua', sans-serif;
    font-size: clamp(40px, 8vw, 64px);
    line-height: 1.1;
    color: var(--mint-dark);
    letter-spacing: -1px;
  }
  .logo span { color: var(--sky); }
  .logo .dot { color: var(--sun); text-shadow: 0 2px 0 #f0b400; }
  .slogan { margin-top: 8px; color: var(--ink-soft); font-size: 15px; }

  .search {
    margin: 28px auto 0;
    max-width: 640px;
    display: flex; align-items: center;
    background: #fff;
    border: 3px solid var(--mint);
    border-radius: 999px;
    padding: 4px 4px 4px 22px;
    box-shadow: 0 8px 24px rgba(46,211,160,.18);
  }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0;
    font-size: 17px; font-family: inherit; background: transparent; padding: 10px 0;
  }
  .search button {
    border: 0; cursor: pointer;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--mint); color: #fff; font-size: 20px;
    display: grid; place-items: center; transition: .2s;
  }
  .search button:hover { background: var(--mint-dark); }
  .search-msg { margin-top: 10px; font-size: 14px; min-height: 22px; color: var(--mint-dark); font-weight: 500; }

  /* 바로가기 아이콘 줄 */
  .shortcuts {
    margin: 22px auto 0;
    display: flex; justify-content: center; flex-wrap: wrap; gap: 14px 22px;
    max-width: 680px;
  }
  .shortcut { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .shortcut i {
    font-style: normal; width: 52px; height: 52px; border-radius: 18px;
    display: grid; place-items: center; font-size: 24px;
    background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.06);
    transition: transform .2s;
  }
  .shortcut:hover i { transform: translateY(-4px) rotate(-4deg); }

  /* ---------- 본문 ---------- */
  main .wrap {
    display: grid; grid-template-columns: 1fr 340px; gap: 20px;
    padding-top: 28px; padding-bottom: 48px;
  }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .card {
    background: var(--card); border-radius: 20px; padding: 22px;
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(36,50,58,.04);
    scroll-margin-top: 70px;
    transition: box-shadow .3s, outline-color .3s;
    outline: 3px solid transparent;
  }
  .card.hit { outline-color: var(--sun); box-shadow: 0 0 0 6px rgba(255,212,59,.25); }
  .card h2 {
    font-family: 'Jua', sans-serif; font-weight: 400; font-size: 22px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .card h2 .tag { font-family: 'Noto Sans KR'; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-left: auto; }

  /* 학급 소개 */
  .intro-top { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .badge-big {
    width: 96px; height: 96px; border-radius: 28px; flex: none;
    background: linear-gradient(135deg, var(--mint), var(--lime));
    color: #fff; font-family: 'Jua'; font-size: 30px; line-height: 1;
    display: grid; place-items: center; text-align: center;
    box-shadow: 0 6px 16px rgba(46,211,160,.35);
  }
  .badge-big small { display: block; font-size: 14px; margin-top: 4px; }
  .intro-text { flex: 1; min-width: 220px; }
  .motto { font-family: 'Jua'; font-size: 20px; color: var(--mint-dark); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
  .stat { border-radius: 14px; padding: 12px 6px; text-align: center; }
  .stat b { display: block; font-family: 'Jua'; font-size: 22px; font-weight: 400; }
  .stat span { font-size: 12px; color: var(--ink-soft); }
  .s1 { background: var(--mint-soft); } .s1 b { color: var(--mint-dark); }
  .s2 { background: var(--sky-soft); } .s2 b { color: #1f9bd6; }
  .s3 { background: var(--sun-soft); } .s3 b { color: #d39b00; }
  .s4 { background: var(--peach-soft); } .s4 b { color: #e0566f; }
  .rules { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .rules li { list-style: none; background: var(--bg); border: 1px dashed var(--mint); padding: 6px 12px; border-radius: 999px; font-size: 13px; }

  /* 주간 학습 일정 */
  .week-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .week-tabs button {
    border: 0; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 6px 14px; border-radius: 999px; background: var(--bg); color: var(--ink-soft);
  }
  .week-tabs button.on { background: var(--mint); color: #fff; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 4px; min-width: 520px; table-layout: fixed; font-size: 14px; }
  th { font-weight: 700; padding: 8px 4px; border-radius: 10px; background: var(--mint-soft); color: var(--mint-dark); }
  th.today { background: var(--sun); color: var(--ink); }
  td { text-align: center; padding: 9px 4px; border-radius: 10px; background: #fafdfc; }
  th:first-child { width: 56px; }
  td.period { background: transparent; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  td.today { background: var(--sun-soft); font-weight: 700; }
  .sch-note { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
  .sch-note span { padding: 4px 10px; border-radius: 8px; background: var(--sky-soft); }

  /* 공지사항 */
  .notice-list { list-style: none; }
  .notice-list li { border-bottom: 1px solid var(--line); }
  .notice-list li:last-child { border-bottom: 0; }
  .notice-list button {
    width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    font-family: inherit; color: inherit; padding: 12px 0; display: flex; gap: 10px; align-items: flex-start;
  }
  .label { flex: none; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-top: 3px; }
  .l-red { background: var(--peach-soft); color: #e0566f; }
  .l-blue { background: var(--sky-soft); color: #1f9bd6; }
  .l-green { background: var(--mint-soft); color: var(--mint-dark); }
  .n-title { font-weight: 500; font-size: 15px; }
  .n-date { display: block; font-size: 12px; color: var(--ink-soft); }
  .n-body { display: none; font-size: 14px; color: var(--ink-soft); background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .notice-list li.open .n-body { display: block; }

  /* 선생님 한마디 */
  .teacher { background: linear-gradient(160deg, #fffbe6, #fff); border-color: #ffe98a; }
  .teacher-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; font-size: 30px; flex: none; }
  .teacher-head b { display: block; }
  .teacher-head small { color: var(--ink-soft); }
  .bubble {
    position: relative; background: #fff; border: 2px solid var(--sun); border-radius: 18px;
    padding: 14px 16px; font-size: 15px;
  }
  .bubble::before {
    content: ''; position: absolute; top: -10px; left: 22px;
    border: 8px solid transparent; border-bottom-color: var(--sun); border-top: 0;
  }
  .cheer { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
  .cheer button {
    border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px;
    background: var(--peach); color: #fff; padding: 8px 16px; border-radius: 999px; transition: transform .15s;
  }
  .cheer button:active { transform: scale(.92); }
  .cheer span { font-size: 13px; color: var(--ink-soft); }

  /* 오늘의 정보 위젯 */
  .today-card { background: linear-gradient(135deg, var(--sky), var(--mint)); color: #fff; border: 0; }
  .today-card h2 { color: #fff; }
  .d-day { font-family: 'Jua'; font-size: 40px; line-height: 1; }
  .today-card p { opacity: .95; font-size: 14px; }

  footer { text-align: center; padding: 24px 16px 40px; color: var(--ink-soft); font-size: 13px; border-top: 1px solid var(--line); background: #fff; }

  @media (max-width: 860px) {
    main .wrap { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .hero { padding: 40px 0 28px; }
    .mini-logo { display: none; }
  }

  /* ---------- 관리자 ---------- */
  .admin-btn {
    display: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 13px;
    background: var(--ink); color: #fff; padding: 6px 14px; border-radius: 999px; white-space: nowrap;
  }
  .admin-btn.show { display: inline-block; }
  .empty { color: var(--ink-soft); font-size: 14px; padding: 8px 0; }
  .admin {
    position: fixed; inset: 0; z-index: 50; background: rgba(36,50,58,.45);
    display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px;
  }
  .admin.open { display: flex; }
  .admin-box { background: #fff; width: 100%; max-width: 820px; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .admin-head {
    position: sticky; top: 0; z-index: 2; background: var(--ink); color: #fff;
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  }
  .admin-head h2 { font-family: 'Jua'; font-weight: 400; font-size: 20px; margin-right: auto; }
  .admin-head button { border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px; }
  .btn-save { background: var(--mint); color: #fff; }
  .btn-save:disabled { opacity: .5; cursor: wait; }
  .btn-close { background: rgba(255,255,255,.15); color: #fff; }
  .admin-status { font-size: 13px; padding: 10px 18px; background: var(--mint-soft); color: var(--mint-dark); display: none; }
  .admin-status.show { display: block; }
  .admin-status.err { background: var(--peach-soft); color: #c23b55; }
  .admin-tabs { display: flex; gap: 6px; padding: 14px 18px 0; flex-wrap: wrap; }
  .admin-tabs button { border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 999px; background: var(--bg); color: var(--ink-soft); }
  .admin-tabs button.on { background: var(--mint); color: #fff; }
  .admin-pane { display: none; padding: 16px 18px 24px; }
  .admin-pane.on { display: block; }
  .admin label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 12px 0 4px; }
  .admin input, .admin textarea, .admin select {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff;
  }
  .admin input:focus, .admin textarea:focus, .admin select:focus { outline: 0; border-color: var(--mint); }
  .admin textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .admin .hint { font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sub { border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 14px; margin-top: 14px; }
  .sub h3 { font-size: 15px; margin-top: 10px; }
  .tt-edit { width: 100%; border-collapse: separate; border-spacing: 3px; min-width: 480px; }
  .tt-edit th { font-size: 12px; padding: 4px; }
  .tt-edit td { padding: 0; background: none; }
  .tt-edit input { padding: 6px 4px; text-align: center; font-size: 14px; }
  @media (max-width: 600px) {
    .grid2, .grid4 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- 상단 네비게이션 -->
<header class="topbar">
  <div class="wrap">
    <a href="#" class="mini-logo">🌱 2-10</a>
    <nav class="nav">
      <a href="#intro" class="active">학급소개</a>
      <a href="#schedule">주간일정</a>
      <a href="#notice">공지사항</a>
      <a href="#teacher">선생님 한마디</a>
    </nav>
    <button class="admin-btn" id="adminBtn">⚙️ 관리자</button>
  </div>
</header>

<!-- 중앙 로고 + 검색창 -->
<section class="hero">
  <div class="wrap">
    <h1 class="logo">2학년 <span>10반</span><span class="dot">!</span></h1>
    <p class="slogan" id="slogan"></p>

    <form class="search" id="searchForm" role="search">
      <input id="q" type="text" placeholder="공지, 과목, 일정을 검색해 보세요 (예: 수학, 체육대회)" autocomplete="off">
      <button type="submit" aria-label="검색">🔍</button>
    </form>
    <p class="search-msg" id="searchMsg"></p>

    <div class="shortcuts">
      <a class="shortcut" href="#intro"><i>🏫</i>학급소개</a>
      <a class="shortcut" href="#schedule"><i>📅</i>시간표</a>
      <a class="shortcut" href="#notice"><i>📢</i>공지</a>
      <a class="shortcut" href="#teacher"><i>💌</i>선생님</a>
      <a class="shortcut" href="#today"><i>⏰</i>D-day</a>
    </div>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="col">

      <section class="card" id="intro">
        <h2>🏫 학급 소개</h2>
        <div class="intro-top">
          <div class="badge-big">2-10<small id="nickname"></small></div>
          <div class="intro-text">
            <p class="motto" id="motto"></p>
            <p id="introText"></p>
          </div>
        </div>
        <div class="stats" id="stats"></div>
        <ul class="rules" id="rules"></ul>
      </section>

      <section class="card" id="schedule">
        <h2>📅 주간 학습 일정 <span class="tag" style="background:var(--sky-soft);color:#1f9bd6" id="weekLabel"></span></h2>
        <div class="week-tabs" id="weekTabs">
          <button data-w="0" class="on">이번 주</button>
          <button data-w="1">다음 주</button>
        </div>
        <div class="table-scroll">
          <table id="timetable"></table>
        </div>
        <div class="sch-note" id="schNote"></div>
      </section>

    </div>

    <aside class="col">

      <section class="card today-card" id="today">
        <h2>⏰ 다가오는 일정</h2>
        <div class="d-day" id="dday">D-?</div>
        <p id="ddayText"></p>
      </section>

      <section class="card" id="notice">
        <h2>📢 공지사항 <span class="tag" style="background:var(--peach-soft);color:#e0566f" id="noticeCount"></span></h2>
        <ul class="notice-list" id="noticeList"></ul>
      </section>

      <section class="card teacher" id="teacher">
        <h2>💌 선생님 한마디</h2>
        <div class="teacher-head">
          <div class="avatar">🧑‍🏫</div>
          <div><b id="tName"></b><small id="tInfo"></small></div>
        </div>
        <div class="bubble" id="teacherMsg"></div>
        <div class="cheer">
          <button id="cheerBtn">💖 응원 보내기</button>
          <span id="cheerCount">0번 응원했어요</span>
        </div>
      </section>

    </aside>
  </div>
</main>

<footer id="footer"></footer>

<!-- ================= 관리자 페이지 ================= -->
<div class="admin" id="admin" role="dialog" aria-modal="true" aria-label="관리자 페이지">
  <div class="admin-box">
    <div class="admin-head">
      <h2>⚙️ 관리자 페이지</h2>
      <button class="btn-save" id="saveBtn">저장하기</button>
      <button class="btn-close" id="closeBtn">닫기</button>
    </div>
    <div class="admin-status" id="adminStatus"></div>
    <div class="admin-tabs" id="adminTabs">
      <button data-p="p-intro" class="on">학급 소개</button>
      <button data-p="p-sch">주간 일정</button>
      <button data-p="p-notice">공지사항</button>
      <button data-p="p-teacher">선생님 한마디</button>
      <button data-p="p-dday">D-day</button>
    </div>

    <div class="admin-pane on" id="p-intro">
      <div class="grid2">
        <div><label>학교 이름</label><input id="f-school"></div>
        <div><label>반 별명</label><input id="f-nickname"></div>
      </div>
      <label>한 줄 슬로건 <span class="hint">(검색창 위 문구)</span></label><input id="f-slogan">
      <label>급훈</label><input id="f-motto">
      <label>학급 소개 글</label><textarea id="f-intro"></textarea>
      <label>정보 칸 4개 <span class="hint">(위: 큰 글씨, 아래: 설명)</span></label>
      <div class="grid4" id="f-stats"></div>
      <label>우리 반 약속 <span class="hint">(한 줄에 하나씩)</span></label><textarea id="f-rules"></textarea>
    </div>

    <div class="admin-pane" id="p-sch"></div>

    <div class="admin-pane" id="p-notice"></div>

    <div class="admin-pane" id="p-teacher">
      <div class="grid2">
        <div><label>이름 / 호칭</label><input id="f-tname"></div>
        <div><label>담당 과목 등</label><input id="f-tinfo"></div>
      </div>
      <label>선생님 한마디</label><textarea id="f-tmsg" style="min-height:140px"></textarea>
    </div>

    <div class="admin-pane" id="p-dday">
      <p class="hint" style="margin-top:4px">날짜가 지나지 않은 가장 가까운 일정이 D-day 칸에 나와요.</p>
      <div id="f-events"></div>
    </div>
  </div>
</div>

<script>
  // ---------- 기본 내용 (파일을 그냥 열었을 때 보이는 예시) ----------
  const DEFAULTS = {
    school: '○○중학교',
    nickname: '새싹반',
    slogan: '우리가 함께 자라는 초록빛 교실 🌿',
    motto: '"서로 웃고, 함께 크자!"',
    intro: '우리 2학년 10반은 서로를 존중하고, 실수해도 다시 도전하는 반이에요. 공부도 놀이도 함께할 때 더 즐겁다는 걸 믿어요. 매일 한 번씩 친구에게 고마운 말을 건네는 것이 우리 반의 작은 전통이랍니다.',
    stats: [
      { value: '28명', label: '우리 반 친구들' },
      { value: '2층', label: '교실 위치' },
      { value: '🌻', label: '반 상징 꽃' },
      { value: '4개', label: '모둠' },
    ],
    rules: ['🙌 먼저 인사하기', '👂 끝까지 듣기', '⏰ 시간 약속 지키기', '🧹 내 자리 내가 정리'],
    weeks: [
      {
        rows: [
          ['국어', '수학', '영어', '과학', '체육'],
          ['수학', '사회', '국어', '영어', '음악'],
          ['영어', '과학', '수학', '국어', '미술'],
          ['과학', '체육', '도덕', '수학', '미술'],
          ['사회', '정보', '체육', '기술가정', '창체'],
          ['도덕', '국어', '동아리', '사회', '창체'],
        ],
        notes: ['📝 수: 영어 단어 시험', '🏃 목: 체육대회 반 연습', '📚 금: 독서 기록장 제출'],
      },
      {
        rows: [
          ['국어', '수학', '영어', '과학', '체육'],
          ['수학', '사회', '수학(수행)', '영어', '음악'],
          ['영어', '과학', '수학', '국어', '미술'],
          ['과학', '체육', '도덕', '수학', '미술'],
          ['사회', '정보', '체육', '기술가정', '창체'],
          ['도덕', '국어', '동아리', '사회', '창체'],
        ],
        notes: ['✏️ 수: 수학 수행평가 (일차함수)', '🧪 목: 과학 실험 보고서', '🎉 금: 체육대회 리허설'],
      },
    ],
    notices: [
      { type: 'red', label: '중요', title: '체육대회 반티 사이즈 조사', date: '10월 17일', body: '체육대회(10/30)에 입을 반티 사이즈를 이번 주 금요일까지 단톡방 설문에 꼭 적어 주세요. 색상은 투표 결과 민트색으로 정해졌어요! 💚' },
      { type: 'blue', label: '학습', title: '수학 수행평가 안내 (일차함수)', date: '10월 15일', body: '다음 주 수요일 3교시에 일차함수 그래프 수행평가가 있어요. 자, 연필, 지우개를 준비하고 교과서 112~125쪽을 복습해 오세요.' },
      { type: 'green', label: '생활', title: '교실 환경 미화 모둠 발표', date: '10월 13일', body: '가을맞이 교실 꾸미기 담당 모둠은 3모둠이에요. 필요한 재료는 선생님께 미리 말해 주면 준비해 줄게요. 🍁' },
    ],
    teacher: {
      name: '담임 선생님',
      info: '국어 담당 · 2학년 10반',
      message: '요즘 날씨가 쌀쌀해졌죠? 감기 조심하고, 체육대회 연습도 무리하지 말기! 결과보다 우리가 함께 땀 흘린 시간이 더 오래 기억에 남을 거예요. 10반, 언제나 응원해요! 🌟',
    },
    events: [
      { name: '체육대회', date: '2026-10-30' },
      { name: '2학기 기말고사', date: '2026-12-08' },
      { name: '겨울방학', date: '2026-12-31' },
    ],
  };

  const DAYS = ['월', '화', '수', '목', '금'];
  const PERIODS = 6;
  const LABEL_TYPES = { red: '빨강(중요)', blue: '파랑(학습)', green: '초록(생활)' };

  let state = null;       // 지금 화면에 보이는 내용
  let currentWeek = 0;

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const clone = o => JSON.parse(JSON.stringify(o));

  // 저장된 내용이 일부 비어 있어도 화면이 깨지지 않도록 모양을 맞춤
  function normalize(d) {
    d = d || {};
    const s = (v, f = '') => (typeof v === 'string' ? v : f);
    const arr = v => (Array.isArray(v) ? v : []);
    const weeks = [0, 1].map(w => {
      const src = arr(d.weeks)[w] || {};
      const rows = [];
      for (let p = 0; p < PERIODS; p++) {
        const r = arr(arr(src.rows)[p]);
        rows.push(DAYS.map((_, i) => s(r[i])));
      }
      return { rows, notes: arr(src.notes).map(x => s(x)).filter(Boolean) };
    });
    const stats = [0, 1, 2, 3].map(i => {
      const st = arr(d.stats)[i] || {};
      return { value: s(st.value), label: s(st.label) };
    });
    const notices = [0, 1, 2].map(i => {
      const n = arr(d.notices)[i] || {};
      return { type: LABEL_TYPES[n.type] ? n.type : 'green', label: s(n.label), title: s(n.title), date: s(n.date), body: s(n.body) };
    });
    const events = [0, 1, 2].map(i => {
      const e = arr(d.events)[i] || {};
      return { name: s(e.name), date: s(e.date) };
    });
    const t = d.teacher || {};
    return {
      school: s(d.school), nickname: s(d.nickname), slogan: s(d.slogan), motto: s(d.motto), intro: s(d.intro),
      stats, rules: arr(d.rules).map(x => s(x)).filter(Boolean), weeks, notices,
      teacher: { name: s(t.name), info: s(t.info), message: s(t.message) },
      events,
    };
  }

  // ---------- 화면 그리기 ----------
  function render() {
    const d = state;
    $('slogan').textContent = d.slogan;
    $('nickname').textContent = d.nickname;
    $('motto').textContent = d.motto;
    $('introText').textContent = d.intro || '아직 학급 소개가 없어요.';
    $('footer').textContent = `${d.school || '우리 학교'} 2학년 10반 · 함께 만드는 우리 반 홈페이지 🌱`;

    const stats = $('stats'); stats.innerHTML = '';
    d.stats.forEach((st, i) => {
      if (!st.value && !st.label) return;
      const box = el('div', 'stat s' + (i + 1));
      box.append(el('b', null, st.value), el('span', null, st.label));
      stats.append(box);
    });
    const rules = $('rules'); rules.innerHTML = '';
    d.rules.forEach(r => rules.append(el('li', null, r)));

    renderWeek(currentWeek);

    const list = $('noticeList'); list.innerHTML = '';
    const notices = d.notices.filter(n => n.title);
    $('noticeCount').textContent = notices.length ? `NEW ${notices.length}` : '';
    if (!notices.length) list.append(el('li', 'empty', '아직 공지가 없어요.'));
    notices.forEach((n, i) => {
      const li = el('li', i === 0 ? 'open' : '');
      const btn = el('button');
      const txt = el('span');
      txt.append(el('span', 'n-title', n.title), el('span', 'n-date', n.date));
      btn.append(el('span', 'label l-' + n.type, n.label || '알림'), txt);
      btn.addEventListener('click', () => li.classList.toggle('open'));
      li.append(btn, el('div', 'n-body', n.body || '내용이 없어요.'));
      list.append(li);
    });

    $('tName').textContent = d.teacher.name;
    $('tInfo').textContent = d.teacher.info;
    $('teacherMsg').textContent = d.teacher.message || '곧 선생님 한마디가 올라올 거예요!';

    renderDday();
  }

  function mondayOf(offsetWeeks) {
    const d = new Date();
    const day = d.getDay() || 7;
    d.setDate(d.getDate() - day + 1 + offsetWeeks * 7);
    return d;
  }

  function renderWeek(w) {
    const mon = mondayOf(w);
    const todayIdx = w === 0 ? (new Date().getDay() + 6) % 7 : -1;
    const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
    $('weekLabel').textContent = `${mon.getMonth() + 1}/${mon.getDate()} ~ ${fri.getMonth() + 1}/${fri.getDate()}`;

    const table = $('timetable'); table.innerHTML = '';
    const head = el('tr'); head.append(el('th'));
    DAYS.forEach((d, i) => {
      const dt = new Date(mon); dt.setDate(mon.getDate() + i);
      const th = el('th', i === todayIdx ? 'today' : '', d + ' ');
      th.append(el('small', null, String(dt.getDate())));
      head.append(th);
    });
    table.append(head);
    state.weeks[w].rows.forEach((r, p) => {
      const tr = el('tr');
      tr.append(el('td', 'period', `${p + 1}교시`));
      r.forEach((s, i) => tr.append(el('td', i === todayIdx ? 'today' : '', s || '-')));
      table.append(tr);
    });
    const note = $('schNote'); note.innerHTML = '';
    state.weeks[w].notes.forEach(n => note.append(el('span', null, n)));
  }

  function renderDday() {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const events = state.events
      .filter(e => e.name && /^\d{4}-\d{2}-\d{2}$/.test(e.date))
      .map(e => { const [y, m, d] = e.date.split('-').map(Number); return { name: e.name, date: new Date(y, m - 1, d) }; })
      .sort((a, b) => a.date - b.date);
    const next = events.find(e => e.date >= now);
    if (!next) { $('dday').textContent = '🎈'; $('ddayText').textContent = '다가오는 일정이 없어요'; return; }
    const diff = Math.round((next.date - now) / 86400000);
    $('dday').textContent = diff === 0 ? 'D-DAY' : `D-${diff}`;
    $('ddayText').textContent = `${next.name}까지 (${next.date.getMonth() + 1}월 ${next.date.getDate()}일)`;
  }

  $('weekTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#weekTabs button').forEach(x => x.classList.toggle('on', x === b));
    currentWeek = +b.dataset.w;
    renderWeek(currentWeek);
  });

  // ---------- 선생님 응원 (내 브라우저에만 저장) ----------
  let cheers = 0;
  try { cheers = +localStorage.getItem('cheer210') || 0; } catch (e) {}
  $('cheerCount').textContent = `${cheers}번 응원했어요`;
  $('cheerBtn').addEventListener('click', () => {
    cheers++;
    try { localStorage.setItem('cheer210', cheers); } catch (e) {}
    $('cheerCount').textContent = `${cheers}번 응원했어요 🎉`;
  });

  // ---------- 검색 ----------
  $('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('q').value.trim();
    const msg = $('searchMsg');
    document.querySelectorAll('.card').forEach(c => c.classList.remove('hit'));
    if (!q) { msg.textContent = ''; return; }
    const hits = [...document.querySelectorAll('main .card')].filter(c => c.textContent.includes(q));
    if (!hits.length) { msg.textContent = `"${q}"에 대한 결과가 없어요 😢`; return; }
    hits.forEach(c => c.classList.add('hit'));
    document.querySelectorAll('.notice-list li').forEach(li => { if (li.textContent.includes(q)) li.classList.add('open'); });
    msg.textContent = `"${q}" 찾음! ${hits.length}개 섹션에 있어요 ✨`;
    hits[0].scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---------- 상단 메뉴 현재 위치 ----------
  const navLinks = document.querySelectorAll('.nav a');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id));
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  ['intro', 'schedule', 'notice', 'teacher'].forEach(id => obs.observe($(id)));

  // ================= 관리자 페이지 =================
  const panel = $('admin');
  let contentRef = null;   // 공유 저장소의 문서 (없으면 저장 불가)

  function input(value, attrs = {}) {
    const i = el('input'); i.value = value;
    Object.assign(i, attrs);
    return i;
  }

  function buildForm() {
    const d = state;
    $('f-school').value = d.school;
    $('f-nickname').value = d.nickname;
    $('f-slogan').value = d.slogan;
    $('f-motto').value = d.motto;
    $('f-intro').value = d.intro;
    $('f-rules').value = d.rules.join('\n');
    const st = $('f-stats'); st.innerHTML = '';
    d.stats.forEach((s, i) => {
      const box = el('div');
      box.append(input(s.value, { placeholder: '예: 28명', id: 'f-sv' + i }), input(s.label, { placeholder: '설명', id: 'f-sl' + i }));
      box.lastChild.style.marginTop = '4px';
      st.append(box);
    });

    const sch = $('p-sch'); sch.innerHTML = '';
    ['이번 주', '다음 주'].forEach((title, w) => {
      const sub = el('div', 'sub');
      sub.append(el('h3', null, `📅 ${title} 시간표`));
      const wrap = el('div', 'table-scroll');
      const t = el('table', 'tt-edit');
      const hr = el('tr'); hr.append(el('th'));
      DAYS.forEach(dn => hr.append(el('th', null, dn)));
      t.append(hr);
      d.weeks[w].rows.forEach((r, p) => {
        const tr = el('tr');
        tr.append(el('th', null, `${p + 1}교시`));
        r.forEach((s, i) => { const td = el('td'); td.append(input(s, { id: `f-t${w}-${p}-${i}` })); tr.append(td); });
        t.append(tr);
      });
      wrap.append(t);
      const lab = el('label', null, '이번 주 메모 ');
      if (w === 1) lab.firstChild.textContent = '다음 주 메모 ';
      lab.append(el('span', 'hint', '(한 줄에 하나씩, 예: 📝 수: 영어 단어 시험)'));
      const ta = el('textarea'); ta.id = 'f-notes' + w; ta.value = d.weeks[w].notes.join('\n');
      sub.append(wrap, lab, ta);
      sch.append(sub);
    });

    const nt = $('p-notice'); nt.innerHTML = '';
    d.notices.forEach((n, i) => {
      const sub = el('div', 'sub');
      sub.append(el('h3', null, `📢 공지 ${i + 1}`));
      const g = el('div', 'grid2');
      const c1 = el('div'); c1.append(el('label', null, '말머리'), input(n.label, { id: 'f-nl' + i, placeholder: '예: 중요' }));
      const c2 = el('div'); c2.append(el('label', null, '말머리 색'));
      const sel = el('select'); sel.id = 'f-nc' + i;
      Object.entries(LABEL_TYPES).forEach(([k, v]) => { const o = el('option', null, v); o.value = k; sel.append(o); });
      sel.value = n.type; c2.append(sel);
      g.append(c1, c2);
      const g2 = el('div', 'grid2');
      const c3 = el('div'); c3.append(el('label', null, '제목'), input(n.title, { id: 'f-nt' + i }));
      const c4 = el('div'); c4.append(el('label', null, '날짜'), input(n.date, { id: 'f-nd' + i, placeholder: '예: 10월 17일' }));
      g2.append(c3, c4);
      const ta = el('textarea'); ta.id = 'f-nb' + i; ta.value = n.body;
      sub.append(g, g2, el('label', null, '내용'), ta);
      nt.append(sub);
    });

    $('f-tname').value = d.teacher.name;
    $('f-tinfo').value = d.teacher.info;
    $('f-tmsg').value = d.teacher.message;

    const ev = $('f-events'); ev.innerHTML = '';
    d.events.forEach((e, i) => {
      const g = el('div', 'grid2');
      const c1 = el('div'); c1.append(el('label', null, `일정 ${i + 1} 이름`), input(e.name, { id: 'f-en' + i, placeholder: '예: 체육대회' }));
      const c2 = el('div'); c2.append(el('label', null, '날짜'), input(e.date, { id: 'f-ed' + i, type: 'date' }));
      g.append(c1, c2);
      ev.append(g);
    });
  }

  function readForm() {
    const v = id => $(id).value.trim();
    const lines = id => $(id).value.split('\n').map(x => x.trim()).filter(Boolean);
    return normalize({
      school: v('f-school'), nickname: v('f-nickname'), slogan: v('f-slogan'), motto: v('f-motto'),
      intro: v('f-intro'), rules: lines('f-rules'),
      stats: [0, 1, 2, 3].map(i => ({ value: v('f-sv' + i), label: v('f-sl' + i) })),
      weeks: [0, 1].map(w => ({
        rows: Array.from({ length: PERIODS }, (_, p) => DAYS.map((_, i) => v(`f-t${w}-${p}-${i}`))),
        notes: lines('f-notes' + w),
      })),
      notices: [0, 1, 2].map(i => ({ type: $('f-nc' + i).value, label: v('f-nl' + i), title: v('f-nt' + i), date: v('f-nd' + i), body: v('f-nb' + i) })),
      teacher: { name: v('f-tname'), info: v('f-tinfo'), message: v('f-tmsg') },
      events: [0, 1, 2].map(i => ({ name: v('f-en' + i), date: v('f-ed' + i) })),
    });
  }

  function status(text, err) {
    const s = $('adminStatus');
    s.textContent = text;
    s.className = 'admin-status' + (text ? ' show' : '') + (err ? ' err' : '');
  }

  function openAdmin() {
    buildForm();
    status(contentRef ? '' : '미리보기 모드예요. 여기서 고친 내용은 이 화면에만 보이고 저장되지 않아요.', !contentRef);
    panel.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeAdmin() {
    panel.classList.remove('open');
    document.body.style.overflow = '';
  }

  $('adminBtn').addEventListener('click', openAdmin);
  $('closeBtn').addEventListener('click', closeAdmin);
  panel.addEventListener('click', e => { if (e.target === panel) closeAdmin(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) closeAdmin(); });
  $('adminTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#adminTabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.admin-pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.p));
  });

  $('saveBtn').addEventListener('click', async () => {
    const next = readForm();
    if (!contentRef) {
      state = next; render();
      status('이 화면에만 반영했어요 (저장 기능이 없는 미리보기).');
      return;
    }
    const btn = $('saveBtn');
    btn.disabled = true; status('저장 중…');
    try {
      await contentRef.set(next);
      state = next; render();
      status('✅ 저장했어요! 학생들 화면에도 바로 반영돼요.');
    } catch (err) {
      status(err && err.code === 'invalid_argument'
        ? '저장 권한이 없어요. 이 페이지의 편집 권한이 있는 계정으로 접속해 주세요.'
        : '저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.', true);
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- 시작 ----------
  state = normalize(DEFAULTS);
  render();

  // claude.ai에 올린 페이지에서는 공유 저장소의 내용을 불러오고, 편집 권한이 있는 사람에게만 관리자 버튼을 보여 줌
  (async () => {
    if (!window.claude || typeof window.claude.use !== 'function') {
      // 파일을 직접 연 경우: 주소 끝에 #admin 을 붙이면 미리보기용 관리자 화면을 볼 수 있음
      if (location.hash === '#admin') { $('adminBtn').classList.add('show'); openAdmin(); }
      return;
    }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db) return;
    contentRef = db.doc('site/content');
    contentRef.onSnapshot(snap => {
      if (snap.exists) {
        state = normalize(snap.data());
        render();
