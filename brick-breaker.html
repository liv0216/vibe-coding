<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>벽돌깨기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #10162b;
    color: #ffffff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }
  /* 상태 표시줄: 프로젝터에서도 잘 보이도록 큰 글씨 */
  #hud {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: clamp(24px, 4vw, 44px);
    font-weight: bold;
  }
  .stat {
    background: #1f2a4d;
    border: 3px solid #3d4f8a;
    border-radius: 14px;
    padding: 6px 22px;
    white-space: nowrap;
  }
  .stat span { color: #ffd43b; }
  #lives span { color: #ff6b6b; letter-spacing: 2px; }
  #stage { position: relative; }
  canvas {
    display: block;
    background: #000814;
    border: 4px solid #4dabf7;
    border-radius: 10px;
    cursor: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: rgba(0, 8, 20, 0.8);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #msgTitle {
    font-size: clamp(40px, 8vw, 84px);
    font-weight: bold;
    color: #ffd43b;
    text-shadow: 0 4px 0 #b8860b;
  }
  #msgSub {
    font-size: clamp(22px, 3.4vw, 36px);
    line-height: 1.5;
  }
  #actionBtn {
    font-family: inherit;
    font-size: clamp(28px, 4.5vw, 46px);
    font-weight: bold;
    padding: 14px 48px;
    border: none;
    border-radius: 18px;
    background: #40c057;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 6px 0 #2b8a3e;
  }
  #actionBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b8a3e; }
  #help {
    font-size: clamp(18px, 2.6vw, 28px);
    color: #ced4da;
    text-align: center;
  }
  #help b { color: #74c0fc; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat">점수 <span id="score">0</span></div>
    <div class="stat" id="lives">생명 <span id="lifeIcons"></span></div>
    <div class="stat">단계 <span id="level">1</span> / 3</div>
  </div>

  <div id="stage">
    <canvas id="game" width="800" height="560"></canvas>
    <div id="overlay">
      <div id="msgTitle">벽돌깨기</div>
      <div id="msgSub">공을 튕겨서 벽돌을 모두 깨 보세요!</div>
      <button id="actionBtn">시작</button>
    </div>
  </div>

  <div id="help">
    <b>← →</b> 키 또는 <b>마우스·터치</b>로 자 이동 &nbsp;|&nbsp; <b>스페이스</b>: 발사·일시정지
  </div>
</div>

<script>
// ===== 기본 설정 =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const MAX_LIVES = 5;
const MAX_LEVEL = 3;
const BRICK_POINT = 10;

// 단계별 설정: 공 속도(초당 픽셀)와 벽돌 줄 수
const LEVELS = [
  { speed: 360, rows: 4 },
  { speed: 460, rows: 5 },
  { speed: 560, rows: 6 },
];
const BRICK_COLS = 10;
const BRICK_COLORS = ["#ff6b6b", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#b197fc"];

// ===== 상태 =====
let score = 0;
let lives = 3;
let level = 1;
// 상태: "title" | "ready"(공이 자 위) | "playing" | "paused" | "levelClear" | "gameOver" | "allClear"
let state = "title";

const paddle = { w: 130, h: 16, x: W / 2 - 65, y: H - 40, speed: 620 };
const ball = { r: 10, x: 0, y: 0, vx: 0, vy: 0 };
let bricks = [];

const keys = { left: false, right: false };

// ===== 화면 요소 =====
const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");
const lifeIconsEl = document.getElementById("lifeIcons");
const overlay = document.getElementById("overlay");
const msgTitle = document.getElementById("msgTitle");
const msgSub = document.getElementById("msgSub");
const actionBtn = document.getElementById("actionBtn");

function updateHud() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  lifeIconsEl.textContent = "♥".repeat(lives) + "♡".repeat(MAX_LIVES - lives);
}

function showOverlay(title, sub, buttonText) {
  msgTitle.textContent = title;
  msgSub.innerHTML = sub;
  if (buttonText) {
    actionBtn.textContent = buttonText;
    actionBtn.style.display = "";
  } else {
    actionBtn.style.display = "none";
  }
  overlay.classList.remove("hidden");
}

function hideOverlay() {
  overlay.classList.add("hidden");
}

// ===== 1. 게임 시작: 점수 0, 생명 3, 단계 1 =====
function startGame() {
  score = 0;
  lives = 3;
  level = 1;
  setupLevel();
}

// ===== 2. 벽돌 배치 + 공을 자 위에 올리기 =====
function setupLevel() {
  const rows = LEVELS[level - 1].rows;
  const gap = 6;
  const top = 60;
  const side = 20;
  const bw = (W - side * 2 - gap * (BRICK_COLS - 1)) / BRICK_COLS;
  const bh = 24;
  bricks = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      bricks.push({
        x: side + c * (bw + gap),
        y: top + r * (bh + gap),
        w: bw,
        h: bh,
        color: BRICK_COLORS[r % BRICK_COLORS.length],
        alive: true,
      });
    }
  }
  paddle.x = W / 2 - paddle.w / 2;
  putBallOnPaddle();
  updateHud();
}

function putBallOnPaddle() {
  ball.vx = 0;
  ball.vy = 0;
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
  state = "ready";
  hideOverlay();
}

// ===== 3. 스페이스: 발사 / 일시정지 =====
function launchBall() {
  const speed = LEVELS[level - 1].speed;
  // 위쪽으로 15~40도 비스듬히, 왼쪽 또는 오른쪽
  const angle = (15 + Math.random() * 25) * Math.PI / 180 * (Math.random() < 0.5 ? -1 : 1);
  ball.vx = speed * Math.sin(angle);
  ball.vy = -speed * Math.cos(angle);
  state = "playing";
}

function onSpace() {
  if (state === "ready") {
    launchBall();
  } else if (state === "playing") {
    state = "paused";
    showOverlay("일시정지", "스페이스를 누르면 계속합니다", "");
  } else if (state === "paused") {
    state = "playing";
    hideOverlay();
  }
}

// 오버레이 버튼: 시작 / 다음 단계 / 다시 하기
function onButton() {
  actionBtn.blur(); // 스페이스가 버튼을 다시 누르지 않도록
  if (state === "title" || state === "gameOver" || state === "allClear") {
    startGame();
  } else if (state === "levelClear") {
    level++;
    setupLevel();
  }
}
actionBtn.addEventListener("click", onButton);

// ===== 4. 입력: 키보드, 마우스, 터치 =====
document.addEventListener("keydown", (e) => {
  if (e.code === "ArrowLeft") keys.left = true;
  if (e.code === "ArrowRight") keys.right = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (!e.repeat) onSpace();
  }
  if (e.code === "Enter" && !overlay.classList.contains("hidden") && actionBtn.style.display !== "none") {
    e.preventDefault();
    onButton();
  }
});
document.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft") keys.left = false;
  if (e.code === "ArrowRight") keys.right = false;
});

function pointerToCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (W / rect.width);
}
function movePaddleTo(x) {
  if (state === "paused") return;
  paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w);
}
canvas.addEventListener("mousemove", (e) => movePaddleTo(pointerToCanvasX(e.clientX)));
canvas.addEventListener("click", () => { if (state === "ready") launchBall(); });
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  movePaddleTo(pointerToCanvasX(e.touches[0].clientX));
  if (state === "ready") launchBall();
}, { passive: false });
canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  movePaddleTo(pointerToCanvasX(e.touches[0].clientX));
}, { passive: false });

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ===== 5. 공이 닿은 곳에 따라 처리 =====
function update(dt) {
  if (state !== "ready" && state !== "playing") return;

  // 자 이동 (키보드)
  if (keys.left) paddle.x -= paddle.speed * dt;
  if (keys.right) paddle.x += paddle.speed * dt;
  paddle.x = clamp(paddle.x, 0, W - paddle.w);

  if (state === "ready") {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }

  // 빠른 공이 벽돌을 뚫고 지나가지 않도록 잘게 나눠서 이동
  const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (ball.r / 2));
  const sdt = dt / steps;
  for (let i = 0; i < steps; i++) {
    ball.x += ball.vx * sdt;
    ball.y += ball.vy * sdt;
    if (moveStep()) return;
  }
}

// 한 걸음 처리. 공이 떨어지거나 단계가 끝나면 true
function moveStep() {
  // 5-1. 벽에 닿으면 튕긴다
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

  // 5-1. 자에 닿으면 튕긴다 (맞은 위치에 따라 각도가 달라짐)
  if (ball.vy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y + ball.r <= paddle.y + paddle.h + ball.r &&
      ball.x >= paddle.x - ball.r &&
      ball.x <= paddle.x + paddle.w + ball.r) {
    let hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
    // 정가운데에 맞아도 똑바로 위로만 오가지 않도록 살짝 기울이기
    if (Math.abs(hit) < 0.1) hit = (Math.random() < 0.5 ? -1 : 1) * (0.1 + Math.random() * 0.1);
    const angle = hit * 60 * Math.PI / 180; // 최대 60도
    const speed = LEVELS[level - 1].speed;
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    ball.y = paddle.y - ball.r;
  }

  // 5-2. 벽돌에 닿으면 벽돌을 없애고 10점
  for (const b of bricks) {
    if (!b.alive) continue;
    const nx = clamp(ball.x, b.x, b.x + b.w);
    const ny = clamp(ball.y, b.y, b.y + b.h);
    const dx = ball.x - nx;
    const dy = ball.y - ny;
    if (dx * dx + dy * dy <= ball.r * ball.r) {
      b.alive = false;
      score += BRICK_POINT;
      updateHud();
      // 어느 쪽 면에 맞았는지 판단해서 튕기기
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) ball.vx = -ball.vx;
      else ball.vy = -ball.vy;
      break;
    }
  }

  // 6~7. 벽돌을 모두 깼는지 확인
  if (bricks.every((b) => !b.alive)) {
    if (level < MAX_LEVEL) {
      // 7-2. 다음 단계로 (보너스 생명 +1, 최대 5)
      state = "levelClear";
      lives = Math.min(MAX_LIVES, lives + 1);
      updateHud();
      showOverlay(level + "단계 완료!", "보너스 생명 +1<br>다음 단계는 공이 더 빨라져요!", "다음 단계");
    } else {
      // 7-3. 3단계까지 모두 깼음
      state = "allClear";
      showOverlay("모든 단계 완료!", "최종 점수: " + score + "점", "다시 하기");
    }
    return true;
  }

  // 5-3. 바닥에 떨어지면 생명 1 감소
  if (ball.y - ball.r > H) {
    lives--;
    updateHud();
    if (lives <= 0) {
      // 7-1. 게임 끝
      state = "gameOver";
      showOverlay("게임 끝", "최종 점수: " + score + "점", "다시 하기");
    } else {
      putBallOnPaddle(); // 2로 돌아가기
    }
    return true;
  }
  return false;
}

// ===== 그리기 =====
function draw() {
  ctx.clearRect(0, 0, W, H);

  // 벽돌
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 5);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 4);
  }

  // 자
  ctx.fillStyle = "#e9ecef";
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);

  // 공
  if (state !== "title") {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd43b";
    ctx.fill();
  }

  // 발사 안내
  if (state === "ready") {
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 36px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("스페이스를 눌러 발사!", W / 2, H / 2 + 60);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

// ===== 화면 크기 맞추기 (비율 유지) =====
function resize() {
  const hud = document.getElementById("hud").offsetHeight;
  const help = document.getElementById("help").offsetHeight;
  const maxW = window.innerWidth - 32;
  const maxH = window.innerHeight - hud - help - 60;
  const scale = Math.min(maxW / W, maxH / H);
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
}
window.addEventListener("resize", resize);

// ===== 반복 실행 =====
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

setupLevel();
state = "title";
showOverlay("벽돌깨기", "공을 튕겨서 벽돌을 모두 깨 보세요!", "시작");
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
